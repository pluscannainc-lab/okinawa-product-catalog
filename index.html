<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>沖縄商品インタラクティブカタログ</title>
  <style>
    :root {
      --blue: #007c9d;
      --blue-dark: #005d75;
      --yellow: #ffd166;
      --sun: #ffb703;
      --coral: #f26b5b;
      --ink: #17333a;
      --muted: #63777c;
      --paper: #fffdf7;
      --line: #dce7e7;
      --row: #f7fbfa;
      --shadow: 0 18px 44px rgba(22, 62, 68, .12);
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: "Yu Gothic", "Hiragino Kaku Gothic ProN", Meiryo, system-ui, sans-serif;
      color: var(--ink);
      background:
        linear-gradient(180deg, rgba(0,124,157,.14), rgba(255,253,247,.98) 330px),
        var(--paper);
    }
    header {
      position: sticky;
      top: 0;
      z-index: 20;
      background: rgba(255, 253, 247, .95);
      backdrop-filter: blur(14px);
      border-bottom: 1px solid rgba(0, 124, 157, .16);
    }
    .wrap { width: min(1280px, calc(100% - 28px)); margin: 0 auto; }
    .hero { padding: 22px 0 16px; display: grid; gap: 14px; }
    .title-row { display: flex; justify-content: space-between; gap: 16px; align-items: end; flex-wrap: wrap; }
    h1 { margin: 0; font-size: clamp(24px, 4vw, 40px); line-height: 1.12; letter-spacing: 0; }
    .lead { margin: 7px 0 0; color: var(--muted); font-size: 14px; }
    .stats { display: flex; gap: 8px; flex-wrap: wrap; }
    .stat { border: 1px solid rgba(0,124,157,.22); background: #fff; border-radius: 8px; padding: 8px 12px; min-width: 94px; }
    .stat strong { display: block; font-size: 20px; color: var(--blue-dark); }
    .stat span { font-size: 11px; color: var(--muted); }
    .controls {
      display: grid;
      grid-template-columns: minmax(240px, 1fr) 160px auto;
      gap: 10px;
      align-items: center;
    }
    select, button {
      border: 1px solid var(--line);
      border-radius: 8px;
      background: #fff;
      color: var(--ink);
      min-height: 44px;
      padding: 0 12px;
      font: inherit;
      outline: none;
    }
    select:focus { border-color: var(--blue); box-shadow: 0 0 0 3px rgba(0,124,157,.16); }
    button { cursor: pointer; font-weight: 700; }
    main { padding: 16px 0 40px; }
    .filter-band { padding: 10px 0 14px; }
    .filter-title { font-size: 13px; color: var(--muted); margin-bottom: 8px; }
    .filters { display: flex; flex-wrap: wrap; gap: 8px; }
    .chip input { position: absolute; opacity: 0; pointer-events: none; }
    .chip span {
      display: inline-flex;
      align-items: center;
      min-height: 34px;
      border: 1px solid rgba(0,124,157,.25);
      border-radius: 999px;
      padding: 0 12px;
      background: #fff;
      cursor: pointer;
      font-size: 13px;
      transition: .16s ease;
    }
    .chip input:checked + span {
      background: var(--blue);
      color: #fff;
      border-color: var(--blue);
      box-shadow: 0 6px 18px rgba(0,124,157,.22);
    }
    .result-line { display: flex; justify-content: space-between; align-items: center; gap: 12px; margin: 2px 0 12px; color: var(--muted); font-size: 13px; }
    .table-shell {
      overflow: auto;
      max-height: calc(100vh - 260px);
      border: 1px solid rgba(0,124,157,.16);
      border-radius: 8px;
      background: #fff;
      box-shadow: var(--shadow);
    }
    table {
      width: 100%;
      min-width: 980px;
      border-collapse: separate;
      border-spacing: 0;
      font-size: 14px;
    }
    thead th {
      position: sticky;
      top: 0;
      z-index: 2;
      background: var(--blue-dark);
      color: #fff;
      text-align: left;
      padding: 11px 12px;
      white-space: nowrap;
      font-size: 13px;
    }
    tbody td {
      border-bottom: 1px solid var(--line);
      padding: 10px 12px;
      vertical-align: top;
      background: #fff;
    }
    tbody tr:nth-child(even) td { background: var(--row); }
    tbody tr:hover td { background: #fff8df; }
    tbody tr { cursor: pointer; }
    .name-cell { min-width: 380px; line-height: 1.5; font-weight: 700; }
    .vendor-cell { min-width: 190px; color: var(--muted); }
    .category-pill {
      display: inline-flex;
      align-items: center;
      min-height: 26px;
      padding: 0 9px;
      border-radius: 999px;
      background: rgba(0,124,157,.1);
      color: var(--blue-dark);
      font-weight: 700;
      white-space: nowrap;
      font-size: 12px;
    }
    .num { text-align: right; white-space: nowrap; font-variant-numeric: tabular-nums; }
    .margin { color: var(--coral); font-weight: 900; }
    .badge {
      display: inline-flex;
      align-items: center;
      min-height: 28px;
      padding: 0 10px;
      border-radius: 999px;
      background: linear-gradient(135deg, var(--sun), var(--yellow));
      color: #563700;
      font-weight: 900;
      white-space: nowrap;
      box-shadow: 0 6px 14px rgba(255,183,3,.24);
    }
    .image-link {
      border-color: rgba(0,124,157,.26);
      min-height: 34px;
      padding: 0 10px;
      color: var(--blue-dark);
      font-size: 13px;
    }
    .empty {
      display: none;
      text-align: center;
      padding: 42px 14px;
      color: var(--muted);
      border: 1px dashed rgba(0,124,157,.35);
      border-radius: 8px;
      background: rgba(255,255,255,.7);
    }
    dialog {
      width: min(920px, calc(100% - 24px));
      border: 0;
      border-radius: 8px;
      padding: 0;
      box-shadow: 0 30px 80px rgba(23, 51, 58, .28);
      background: #fff;
    }
    dialog::backdrop { background: rgba(13, 38, 45, .48); }
    .modal-head {
      display: flex;
      justify-content: space-between;
      gap: 12px;
      align-items: center;
      padding: 12px 14px;
      border-bottom: 1px solid var(--line);
    }
    .modal-title { margin: 0; font-size: 16px; line-height: 1.4; }
    .modal-close { min-height: 36px; }
    .modal-body { padding: 14px; }
    .modal-body img {
      display: block;
      width: 100%;
      max-height: 72vh;
      object-fit: contain;
      background: #f4f7f7;
      border-radius: 8px;
    }
    @media (max-width: 1024px) {
      .wrap { width: min(100% - 22px, 960px); }
      .hero { padding: 18px 0 14px; }
      .controls { grid-template-columns: minmax(210px, 1fr) 150px auto; }
      .table-shell { max-height: calc(100vh - 245px); }
      table { min-width: 900px; font-size: 13px; }
      thead th, tbody td { padding: 9px 10px; }
      .name-cell { min-width: 320px; }
      .vendor-cell { min-width: 160px; }
    }
    @media (max-width: 760px) {

      .stats { width: 100%; gap: 6px; }
      .stat { flex: 1; min-width: 0; padding: 7px 9px; }
      .stat strong { font-size: 18px; }
      main { padding-top: 10px; }
      .filter-band { padding: 8px 0 12px; }
      .filters { gap: 6px; max-height: 96px; overflow: auto; padding-bottom: 2px; }
      .chip span { min-height: 32px; padding: 0 10px; font-size: 12px; }
      .result-line { align-items: flex-start; flex-direction: column; gap: 3px; margin-bottom: 10px; }
      .table-shell { overflow: visible; max-height: none; border: 0; background: transparent; box-shadow: none; }
      table, tbody, tr, td { display: block; width: 100%; }
      table { min-width: 0; border-collapse: collapse; font-size: 14px; }

      tbody { display: grid; gap: 10px; }
      tbody tr {
        position: relative;
        background: #fff;
        border: 1px solid rgba(0,124,157,.16);
        border-radius: 8px;
        box-shadow: 0 10px 24px rgba(22,62,68,.1);
        padding: 11px 12px;
      }
      tbody tr:nth-child(even) td, tbody td { background: transparent; }
      tbody tr:hover td { background: transparent; }
      tbody td { border-bottom: 0; padding: 0; }
      .name-cell { min-width: 0; font-size: 14px; line-height: 1.55; margin-bottom: 7px; padding-right: 84px; }
      .vendor-cell { min-width: 0; color: var(--muted); font-size: 12px; margin-bottom: 8px; padding-right: 84px; }
      td:nth-child(3) { margin-bottom: 8px; }
      td:nth-child(4), td:nth-child(5), td:nth-child(6) {

        padding: 5px 0;

      td:nth-child(5)::before { content: "\53c2\8003\4e0a\4ee3"; color: var(--muted); font-size: 12px; }
      td:nth-child(6)::before { content: "\5229\5e45"; color: var(--muted); font-size: 12px; }
      td:nth-child(7) { position: absolute; top: 12px; right: 12px; width: auto; }
      td:nth-child(8) { margin-top: 9px; }
      .image-link { width: 100%; min-height: 40px; background: rgba(0,124,157,.08); }
      .badge { min-height: 24px; padding: 0 8px; font-size: 12px; }
      dialog { width: min(100% - 16px, 560px); }
      .modal-head { padding: 10px 12px; }
      .modal-title { font-size: 14px; }
      .modal-body { padding: 10px; }
      .modal-body img { max-height: 76vh; }
    }
  </style>

            <th>利幅</th>
            <th>送料</th>
            <th>画像</th>

        </thead>
        <tbody id="rows"></tbody>
      </table>
    </section>
    <section class="empty" id="empty">該当する商品がありません。</section>
  </main>

    <div class="modal-body" id="modalBody"></div>

    const yen = new Intl.NumberFormat('ja-JP', { style: 'currency', currency: 'JPY', maximumFractionDigits: 0 });
    const state = { vendor: '', categories: new Set(), sort: 'default' };
    const categories = [...new Set(PRODUCTS.map(item => item.category))].sort((a, b) => a.localeCompare(b, 'ja'));
    const vendors = [...new Set(PRODUCTS.map(item => item.vendor))].sort((a, b) => a.localeCompare(b, 'ja'));

    const filters = document.getElementById('filters');
    const rows = document.getElementById('rows');
    const resultCount = document.getElementById('resultCount');
    const empty = document.getElementById('empty');
    const dialog = document.getElementById('imageDialog');
    const modalTitle = document.getElementById('modalTitle');
    const modalBody = document.getElementById('modalBody');

    function margin(item) {
      if (!item.retail) return 0;
      return (item.retail - item.wholesale) / item.retail;
    }

    function formatMargin(item) {
      return `${Math.round(margin(item) * 1000) / 10}%`;
    }

    function escapeHtml(value) {
      return String(value).replace(/[&<>"']/g, char => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[char]));
    }

    function row(item, index) {
      return `<tr data-index="${index}">
        <td class="name-cell">${escapeHtml(item.name)}</td>
        <td class="vendor-cell">${escapeHtml(item.vendor)}</td>
        <td><span class="category-pill">${escapeHtml(item.category)}</span></td>
        <td class="num">${yen.format(item.wholesale)}</td>
        <td class="num">${yen.format(item.retail)}</td>
        <td class="num margin">${formatMargin(item)}</td>
        <td>${item.freeShipping ? '<span class="badge">送料無料</span>' : ''}</td>
        <td><button class="image-link" data-index="${index}" type="button">画像</button></td>
      </tr>`;
    }

    function renderFilters() {
      filters.innerHTML = categories.map(category => `<label class="chip">
        <input type="checkbox" value="${escapeHtml(category)}">
        <span>${escapeHtml(category)}</span>
      </label>`).join('');
      filters.addEventListener('change', event => {
        if (event.target.matches('input[type="checkbox"]')) {
          state.categories = new Set([...filters.querySelectorAll('input:checked')].map(input => input.value));
          render();
        }
      });
    }

    function renderVendorOptions() {
      const select = document.getElementById('vendorFilter');
      select.innerHTML = '<option value="">すべての事業者</option>' + vendors.map(vendor =>
        `<option value="${escapeHtml(vendor)}">${escapeHtml(vendor)}</option>`
      ).join('');
    }

    function filteredProducts() {
      let list = PRODUCTS.map((item, index) => ({ item, index })).filter(entry => {
        const item = entry.item;
        const categoryOk = state.categories.size === 0 || state.categories.has(item.category);
        const vendorOk = !state.vendor || item.vendor === state.vendor;
        return categoryOk && vendorOk;
      });
      list = [...list];
      if (state.sort === 'marginDesc') list.sort((a, b) => margin(b.item) - margin(a.item));
      if (state.sort === 'wholesaleAsc') list.sort((a, b) => a.item.wholesale - b.item.wholesale);
      if (state.sort === 'retailDesc') list.sort((a, b) => b.item.retail - a.item.retail);
      return list;
    }

    function render() {
      const list = filteredProducts();
      resultCount.textContent = `${list.length} / ${PRODUCTS.length} 件を表示`;
      rows.innerHTML = list.map(entry => row(entry.item, entry.index)).join('');
      empty.style.display = list.length ? 'none' : 'block';
    }

    function openImage(index) {
      const item = PRODUCTS[index];
      modalTitle.textContent = `${item.vendor} / ${item.name}`;
      modalBody.innerHTML = item.image
        ? `<img src="${escapeHtml(item.image)}" alt="${escapeHtml(item.name)}">`
        : '<p>画像が登録されていません。</p>';
      dialog.showModal();
    }

    rows.addEventListener('click', event => {
      const tr = event.target.closest('tr[data-index]');
      if (tr) openImage(Number(tr.dataset.index));
    });
    document.getElementById('vendorFilter').addEventListener('change', event => {
      state.vendor = event.target.value;
      render();
    });
    document.getElementById('sort').addEventListener('change', event => {
      state.sort = event.target.value;
      render();
    });
    document.getElementById('clear').addEventListener('click', () => {
      state.vendor = '';
      state.categories.clear();
      state.sort = 'default';
      document.getElementById('vendorFilter').value = '';
      document.getElementById('sort').value = 'default';
      filters.querySelectorAll('input').forEach(input => input.checked = false);
      render();
    });
    document.getElementById('modalClose').addEventListener('click', () => dialog.close());
    dialog.addEventListener('click', event => {
      if (event.target === dialog) dialog.close();
    });

    renderVendorOptions();
    renderFilters();
    render();
  </script>
